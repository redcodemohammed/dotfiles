# Shared palette. Single source of truth for every UI color.
# Generated by palette/from-wallpaper.py from 5m5kLI9.png; the hand-made palette is
# palette-default.toml (restore it with: from-wallpaper.py --default). Dark only.
# Contrast on bg: fg 15.2, fg_muted 5.5, accent 9.3; on_accent on accent 9.3.

[ui]
