red              = "#d46a6e"
green            = "#8caf78"
yellow           = "#fe8ebc"
blue             = "#6f9bc9"
magenta          = "#b78db8"
cyan             = "#6db5b1"
white            = "#c7c3c5"

[ansi.bright]
