# Shared palette. Single source of truth for every UI color.
# Generated by palette/from-wallpaper.py from blue_arch_nowatermark.png; the hand-made palette is
# palette-default.toml (restore it with: from-wallpaper.py --default). Dark only.
# Contrast on bg: fg 15.1, fg_muted 5.5, accent 9.5; on_accent on accent 9.5.

[ui]
bg               = "#0e1116"
surface          = "#161a20"
surface_selected = "#20242a"
border           = "#2f3339"
fg               = "#e4e6ea"
fg_muted         = "#888a8e"
fg_dim           = "#5a5c60"
accent           = "#7ebcff"
on_accent        = "#0e1116"
alert            = "#e5484d"

[ansi.normal]
black            = "#2f3339"
red              = "#d46a6e"
green            = "#8caf78"
yellow           = "#7ebcff"
blue             = "#6f9bc9"
magenta          = "#b78db8"
cyan             = "#6db5b1"
white            = "#c2c4c8"

[ansi.bright]
black            = "#888a8e"
red              = "#d8797c"
green            = "#98b786"
yellow           = "#97c9ff"
blue             = "#7da5ce"
magenta          = "#be98bf"
cyan             = "#7cbcb9"
white            = "#e4e6ea"
