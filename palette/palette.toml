# Shared palette. Single source of truth for every UI color.
# Generated by palette/from-wallpaper.py from wallpaperflare.com_wallpaper.jpg; the hand-made palette is
# palette-default.toml (restore it with: from-wallpaper.py --default). Dark only.
# Contrast on bg: fg 15.2, fg_muted 5.5, accent 8.8; on_accent on accent 8.8.

[ui]
bg               = "#150f13"
surface          = "#1e181c"
surface_selected = "#282226"
border           = "#383135"
fg               = "#e9e5e7"
fg_muted         = "#8d898b"
fg_dim           = "#5f5b5d"
accent           = "#fe8ebc"
on_accent        = "#150f13"
alert            = "#e5484d"

[ansi.normal]
