# Shared palette. Single source of truth for every UI color.
# Generated by palette/from-wallpaper.py from wallhaven-1qod3w.jpg; the hand-made palette is
# palette-default.toml (restore it with: from-wallpaper.py --default). Dark only.
# Contrast on bg: fg 15.1, fg_muted 5.5, accent 10.2; on_accent on accent 10.2.

[ui]
bg               = "#111111"
surface          = "#1a1a1a"
surface_selected = "#242424"
border           = "#333333"
fg               = "#e6e6e6"
fg_muted         = "#8a8a8a"
fg_dim           = "#5c5c5c"
accent           = "#bebebe"
on_accent        = "#111111"
alert            = "#e5484d"

[ansi.normal]
black            = "#333333"
red              = "#d46a6e"
green            = "#8caf78"
yellow           = "#f5a524"
blue             = "#6f9bc9"
magenta          = "#b78db8"
cyan             = "#6db5b1"
white            = "#c4c4c4"

[ansi.bright]
black            = "#8a8a8a"
red              = "#d8797c"
green            = "#98b786"
yellow           = "#f6ae3a"
blue             = "#7da5ce"
magenta          = "#be98bf"
cyan             = "#7cbcb9"
white            = "#e6e6e6"

[wallpaper]  # the image's own colours, in hue order (cava)
c1               = "#555555"
c2               = "#6c6c6c"
c3               = "#838383"
c4               = "#9b9b9b"
c5               = "#b4b4b4"
c6               = "#cecece"
