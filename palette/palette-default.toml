# Shared palette. Single source of truth for every UI color.
# Values from docs/design-system/project/tokens.json. Dark only.
# Generated from this file: Quickshell Theme.qml, Alacritty colors.
# Contrast figures are against bg #111111.

[ui]
bg               = "#111111" # screen, bar, lock, terminal
surface          = "#1a1a1a" # windows, launcher, popups, OSD
surface_selected = "#242424" # launcher row, terminal selection (proposed)
border           = "#333333" # inactive border, dividers, level track
fg               = "#e6e6e6" # 15.1:1
fg_muted         = "#8a8a8a" # 5.5:1
fg_dim           = "#5c5c5c" # empty workspace only, decorative (proposed)
accent           = "#f5a524" # amber: focus or unread, never caution. 9.3:1
on_accent        = "#111111" # text on amber fill, never white
alert            = "#e5484d" # red: live or failed only. 4.8:1

# ANSI: muted, desaturated. Amber takes yellow. Bright about 10% lighter.
[ansi.normal]
black   = "#333333" # background use, not text
red     = "#d46a6e" # 5.5:1
green   = "#8caf78" # 7.7:1
yellow  = "#f5a524" # = accent
blue    = "#6f9bc9" # 6.5:1
magenta = "#b78db8" # 6.8:1
cyan    = "#6db5b1" # 8.0:1
white   = "#c4c4c4" # 10.8:1

[ansi.bright]
black   = "#8a8a8a" # = fg_muted, comments and autosuggestions
red     = "#d8797c" # 6.3:1
green   = "#98b786" # 8.5:1
yellow  = "#f6ae3a" # 9.9:1
blue    = "#7da5ce" # 7.3:1
magenta = "#be98bf" # 7.6:1
cyan    = "#7cbcb9" # 8.8:1
white   = "#e6e6e6" # = fg

# The bar's chips (owner, 2026-10-20): the accent turned round the colour wheel in 60-degree
# steps, at the amber's lightness (from-wallpaper.py spread(), from #f5a524). Red means alert,
# so hue6 stops at the red zone's edge: a pink. Contrast on each one's own chip, 5.9 to 6.7.
[hues]
hue1 = "#f5a524" # = accent
hue2 = "#90cc5b" # green
hue3 = "#0ed2ce" # teal
hue4 = "#80bcff" # blue
hue5 = "#d998ff" # purple
hue6 = "#ff91ac" # pink
