# hyprpaper (0.8). Started from hyprland.lua. Wallpaper image chosen by the owner (2026-10-15),
# replacing the spec's solid color; Hyprland's misc.background_color stays underneath as fallback.
# The image lives outside the repo, in ~/Pictures/Wallpapers.

wallpaper {
    monitor =
    path = ~/Pictures/Wallpapers/177901-nature-forest-mist-sunrise-leaves-fall-trees-landscape.jpg
    fit_mode = cover
}

# No Hyprland splash text over the wallpaper.
splash = false
