# hyprpaper (0.8). Started from hyprland.lua. Wallpaper image chosen by the owner (2026-10-15, 1920x1080),
# replacing the spec's solid color; Hyprland's misc.background_color stays underneath as fallback.
# The image lives outside the repo, in ~/Pictures/Wallpapers.

wallpaper {
    monitor =
    path = ~/Pictures/Wallpapers/wallhaven-1qod3w.jpg
    fit_mode = cover
}

# No Hyprland splash text over the wallpaper.
splash = false
