# hyprlock: emergency fallback only. The real lock screen is Quickshell (build step 10).
# Keys from /usr/share/hypr/hyprlock.conf (0.9.6) and the hyprlock wiki. Palette colors.

general {
    hide_cursor = false
}

# Empty path: solid fill with color.
background {
    monitor =
    color = rgba(17, 17, 17, 1.0)
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    rounding = 0
    inner_color = rgba(26, 26, 26, 1.0)
    outer_color = rgba(51, 51, 51, 1.0)
    check_color = rgba(245, 165, 36, 1.0)
    fail_color = rgba(229, 72, 77, 1.0)
    font_color = rgb(230, 230, 230)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    placeholder_text = Password
    fail_text = $PAMFAIL
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    color = rgba(230, 230, 230, 1.0)
    position = 0, 80
    halign = center
    valign = center
}
