# hypridle: idle chain from the design spec. Syntax from /usr/share/hypr/hypridle.conf (0.1.8)
# and the hypridle wiki.

# Timings: these defaults, then the settings panel's (Power tab; quickshell/Settings.qml writes
# hypridle-settings.conf and restarts hypridle). A missing or broken file only logs an error and
# these stay (tested 2026-10-17), so the lock never depends on it.
$lock_after = 300        # s idle before the lock
$screen_off_after = 360  # s idle before the screens go off
$sleep_after = 1800      # s idle before suspend (on battery only)
$sleep_on = 1            # 0: never suspend from idle
source = ~/.config/hypr/hypridle-settings.conf

general {
    # Quickshell lock; flock stops a second locker if one is already up.
    lock_cmd = flock -n "$XDG_RUNTIME_DIR/quickshell-lock.flock" qs -p "$HOME/.config/quickshell-lock"
    before_sleep_cmd = loginctl lock-session                          # lock before any sleep, lid close included
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # screens on after resume
    inhibit_sleep = 3                                                 # sleep waits until the session is actually locked
}

# Lock.
listener {
    timeout = $lock_after
    on-timeout = loginctl lock-session
}

# Screens off, back on at the first input.
listener {
    timeout = $screen_off_after
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Suspend, on battery only. Never fires on mains power, without a battery, or with $sleep_on 0.
listener {
    timeout = $sleep_after
    on-timeout = test $sleep_on = 1 && grep -qx Discharging /sys/class/power_supply/BAT*/status 2>/dev/null && systemctl suspend
}
