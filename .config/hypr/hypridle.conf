# hypridle: idle chain from the design spec. Starting values, tune later.
# Syntax from /usr/share/hypr/hypridle.conf (0.1.8) and the hypridle wiki.

general {
    # Quickshell lock; flock stops a second locker if one is already up.
    lock_cmd = flock -n "$XDG_RUNTIME_DIR/quickshell-lock.flock" qs -p "$HOME/.config/quickshell-lock"
    before_sleep_cmd = loginctl lock-session                          # lock before any sleep, lid close included
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # screens on after resume
    inhibit_sleep = 3                                                 # sleep waits until the session is actually locked
}

# 5 min: lock.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 6 min: screens off, back on at the first input.
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 30 min: suspend, on battery only. Never fires on mains power or without a battery.
listener {
    timeout = 1800
    on-timeout = grep -qx Discharging /sys/class/power_supply/BAT*/status 2>/dev/null && systemctl suspend
}
