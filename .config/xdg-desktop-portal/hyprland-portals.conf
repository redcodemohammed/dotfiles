# xdg-desktop-portal reads this under Hyprland only (<XDG_CURRENT_DESKTOP>-portals.conf).
# File dialogs go to Strata (strata.portal in ~/.local/share/xdg-desktop-portal/portals, put there by
# Strata's installer). The first listed backend that is installed wins when the portal starts, so
# without Strata it is GTK's dialog (hyprland has no file chooser). Everything else: hyprland, gtk.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=strata;hyprland;gtk;
