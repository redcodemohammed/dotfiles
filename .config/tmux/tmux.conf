set-option -g automatic-rename on
set-option -g allow-rename off
set-option -sa terminal-overrides ",xterm*:Tc"
set -g default-terminal "screen-256color"

set -g mouse on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g status-position top

# Set new panes to open in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'


set -g @fzf-url-bind 'x'

#
set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @tokyo-night-tmux_theme night
set -g @tokyo-night-tmux_window_id_style digital
set -g @tokyo-night-tmux_pane_id_style hsquare
set -g @tokyo-night-tmux_zoom_id_style dsquare
set -g @tokyo-night-tmux_show_battery_widget 1
set -g @tokyo-night-tmux_show_path 1
set -g @tokyo-night-tmux_show_git 1
set -g @tokyo-night-tmux_show_datetime 1
# Second status line for path + now playing (tmux keeps all status lines together, so it sits under the main bar).
# Own shade (#24283b) so the two bars read as separate strips: push-default makes widgets' bg=default use it,
# and fill paints the empty middle. Now playing is our own script (scripts/now-playing.sh) so the title isn't capped at 25 chars.
set -g status 2
set -g status-format[1] "#[bg=#24283b]#[push-default]#[fill=#24283b]#[align=left]#(~/.config/tmux/plugins/tokyo-night-tmux/src/path-widget.sh #{q:pane_current_path})#[align=right]#(~/.config/tmux/scripts/now-playing.sh #{client_width} #{q:pane_current_path})"
# No built-in CPU widget, so pull it from tmux-cpu's script (entries are comma-split, so no commas inside one).
# Leading/trailing commas are deliberate: the plugin reads this via `tmux show -g`, which wraps the value in
# quotes, and the extra empty entries absorb those quotes so the first/last real widgets aren't dropped.
set -g @tokyo-night-tmux_show_right_widgets ",#[fg=blue]░ #[fg=default] #(~/.config/tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh) #[default],battery,git,datetime,"

set -g @plugin 'tmux-plugins/tpm'
run -b '~/.tmux/plugins/tpm/tpm'


