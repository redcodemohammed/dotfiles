# tmux. Prefix Ctrl+Space. Colors in colors.conf, generated by palette/generate.py.

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Windows and panes count from 1, like the keyboard's number row. Closing one renumbers the rest.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# New windows and splits start in the current pane's directory.
# -N "Group: what it does": the note the shortcuts panel (SUPER + F1, Desktop's tmux tab) shows.
bind -N "Windows: New window" c new-window -c "#{pane_current_path}"
bind -N "Panes: Split below" '"' split-window -c "#{pane_current_path}"
bind -N "Panes: Split right" % split-window -h -c "#{pane_current_path}"

# Without the prefix: Alt+arrows move between panes, Shift+arrows between windows (from the old config).
bind -N "Panes: Move between panes" -n M-Left select-pane -L
bind -N "Panes: Move between panes" -n M-Right select-pane -R
bind -N "Panes: Move between panes" -n M-Up select-pane -U
bind -N "Panes: Move between panes" -n M-Down select-pane -D
bind -N "Windows: Previous window" -n S-Left previous-window
bind -N "Windows: Next window" -n S-Right next-window

# Pass 24-bit color through, so Neovim inside tmux keeps its colorscheme.
set -as terminal-features ",xterm-256color:RGB,alacritty:RGB"

# Status bar: windows only. Clock and host live in the desktop bar.
set -g status-position top # owner, 2026-10-17
set -g status-left " #S "
set -g status-left-length 20
set -g status-right ""
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-separator ""

source-file -F "#{d:current_file}/colors.conf"

# Plugins via TPM (~/.tmux/plugins/tpm), each pinned as a git submodule in plugins/: clone with --recursive.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'         # copy-mode selections go to the clipboard (wl-copy)
set -g @plugin 'wfxr/tmux-fzf-url'              # prefix x: pick a URL on screen with fzf and open it
set -g @fzf-url-bind 'x'
set -g @plugin 'christoomey/vim-tmux-navigator' # Ctrl+h/j/k/l across tmux panes and Neovim splits
run '~/.tmux/plugins/tpm/tpm'                  # not -b: the notes below must come after the plugins' binds

# Notes for built-in and plugin keys the panel should list. `bind -N note key` with no command
# only sets the note (tested, tmux 3.8); a plugin binding the key later would wipe it, hence
# the foreground `run` above.
bind -N "Sessions: Detach" d
bind -N "Sessions: Pick a session" s
bind -N "Sessions: Rename session" '$'
bind -N "Windows: Rename window" ,
bind -N "Windows: Close window" &
bind -N "Windows: Go to 1-9" 1
bind -N "Windows: Go to 1-9" 2
bind -N "Windows: Go to 1-9" 3
bind -N "Windows: Go to 1-9" 4
bind -N "Windows: Go to 1-9" 5
bind -N "Windows: Go to 1-9" 6
bind -N "Windows: Go to 1-9" 7
bind -N "Windows: Go to 1-9" 8
bind -N "Windows: Go to 1-9" 9
bind -N "Panes: Zoom" z
bind -N "Copy: Copy mode (scroll, select)" [
bind -N "Copy: Copy the selection" -T copy-mode y
bind -N "Copy: Open a URL on screen" x
bind -N "Panes: Move between panes and Neovim" -n C-h
bind -N "Panes: Move between panes and Neovim" -n C-j
bind -N "Panes: Move between panes and Neovim" -n C-k
bind -N "Panes: Move between panes and Neovim" -n C-l
