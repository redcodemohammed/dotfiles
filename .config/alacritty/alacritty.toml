# Alacritty. tmux handles splits and sessions, so no tabs.
# Colors come from colors.toml, generated by palette/generate.py.

[general]
import = ["colors.toml"]

[window]
padding = { x = 8, y = 8 }
decorations = "None"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
# Matched to the 13px bar text: 13px = 9.75pt at 96 DPI.
size = 9.75

[cursor]
style = { shape = "Block" }

# Every window joins one tmux session, "main": created by the first window, attached by the rest.
# Closing a window only detaches; the session keeps running.
[terminal]
shell = { program = "tmux", args = ["new-session", "-A", "-s", "main"] }
