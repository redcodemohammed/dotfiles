
[font]
size = 14

[font.normal]
family = "Google Sans Code"

[font.bold]
family = "Google Sans Code"

[font.italic]
family = "Google Sans Code"

[window]
opacity = 0.99

[window.padding]
x = 10
y = 10

[window.dimensions]
columns = 120
lines = 38


[[keyboard.bindings]]
key = "Return"
mods = "Control|Shift"
action = "SpawnNewInstance"

[terminal.shell]
program = "/bin/tmux"

[general]
import = [
