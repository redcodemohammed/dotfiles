
[font]
size = 15

[font.normal]
family = "RecMonoCasual Nerd Font"

[font.bold]
family = "RecMonoCasual Nerd Font"

[font.italic]
family = "RecMonoCasual Nerd Font"

[window]
opacity = 0.90
blur = true
decorations = "none"

[window.padding]
x = 10
y = 10

[window.dimensions]
columns = 120
lines = 38


[[keyboard.bindings]]
key = "Return"
mods = "Control|Shift"
action = "SpawnNewInstance"

[terminal.shell]
program = "/bin/tmux"

[general]
import = [
  # "/home/mohammed/.local/share/pnpm/global/5/.pnpm/alacritty-themes@6.0.2/node_modules/alacritty-themes/themes/Ayu-Dark.toml",
  "~/.config/alacritty/catppuccin-mocha.toml"
]
