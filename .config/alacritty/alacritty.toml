# Alacritty. tmux handles splits and sessions, so no tabs.
# Colors come from colors.toml, generated by palette/generate.py.

[general]
import = ["colors.toml"]

[window]
padding = { x = 8, y = 8 }
decorations = "None"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
# Matched to the 13px bar text: 13px = 9.75pt at 96 DPI.
size = 9.75

[cursor]
style = { shape = "Block" }

# Every window gets its own tmux session, which ends when the window closes
# (destroy-unattached, set for that session only): a plain terminal with tmux splits.
[terminal]
shell = { program = "tmux", args = ["new-session", ";", "set-option", "destroy-unattached", "on"] }
