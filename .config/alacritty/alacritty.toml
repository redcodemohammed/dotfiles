
[font]
size = 14

[font.normal]
family = "JetBrainsMono Nerd Font"

[font.bold]
family = "JetBrainsMono Nerd Font"

[font.italic]
family = "JetBrainsMono Nerd Font"

[window]
opacity = 0.99
decorations = "None"

[window.padding]
x = 10
y = 10

[window.dimensions]
columns = 120
lines = 38


[[keyboard.bindings]]
key = "Return"
mods = "Control|Shift"
action = "SpawnNewInstance"

[terminal.shell]
program = "/bin/tmux"

[general]
	import = ["rose-pine.toml"]
