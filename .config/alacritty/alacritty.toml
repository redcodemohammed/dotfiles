# Alacritty. tmux handles splits and sessions, so no tabs.
# Colors come from colors.toml, generated by palette/generate.py.

[general]
import = ["colors.toml", "settings.toml"] # settings.toml: the shell's settings panel

[window]
padding = { x = 8, y = 8 }
decorations = "None"
# See-through, with Hyprland's blur behind it (owner, 2026-10-17, overriding the spec's "no
# transparency"): opacity lives in settings.toml (Terminal opacity in the settings panel), since
# this file loads after its imports and would always win.

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
# 13pt (owner, 2026-10-15): about 17px at 96 DPI, larger than the bar's 13px text (was 9.75pt = 13px).
size = 13

[cursor]
style = { shape = "Block" }

# Every window gets its own tmux session, which ends when the window closes
# (destroy-unattached, set for that session only): a plain terminal with tmux splits.
[terminal]
shell = { program = "tmux", args = ["new-session", ";", "set-option", "destroy-unattached", "on"] }
