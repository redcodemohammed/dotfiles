# keyd: Caps Lock taps as Escape, holds as Ctrl. All keyboards.
# Linked to /etc/keyd/default.conf. Stop from a TTY: sudo systemctl stop keyd

[ids]
*

[global]
# A hold longer than this never sends Escape. Starting value, tune by feel.
overload_tap_timeout = 200

[main]
capslock = overload(control, esc)
