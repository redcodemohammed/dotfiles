# /etc/strongswan.d/charon-group.conf, copied from ~/dotfiles/strongswan with sudo (not stowed).
# charon's group: its control socket /run/charon.vici becomes root:vpn, so members of the vpn
# group can use swanctl without root (the network panel's VPN tab). Owner's choice, 2026-10-15.
charon {
    group = vpn
}
